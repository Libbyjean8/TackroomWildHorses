<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RDR2 Interactive Map</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="map">
        <div id="filter-panel">

            <h2>Horse Spawn Filters</h2>


            <!-- Location Rarity -->

            <div class="filter-section">

                <h3>Location Rarity</h3>

                <label class="rarity-option">
                    <input type="checkbox"
                           id="rarity-common"
                           value="common"
                           checked>
                    Common
                </label>

                <label class="rarity-option">
                    <input type="checkbox"
                           id="rarity-uncommon"
                           value="uncommon"
                           checked>
                    Uncommon
                </label>

                <label class="rarity-option">
                    <input type="checkbox"
                           id="rarity-rare"
                           value="rare"
                           checked>
                    Rare
                </label>

            </div>


            <!-- Horse -->

            <div class="filter-section">

                <h3>Horse</h3>

                <select id="horse-filter">

                    <option value="">
                        All Horses
                    </option>

                </select>

            </div>


            <!-- Reset -->

            <button id="reset-filters">
                Reset Filters
            </button>

        </div>

        <div id="coordinates">Click the map to get coordinates</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="horseSpawns.js"></script>

    <script>

        // Size of our map image
        const imageWidth = 10000;
        const imageHeight = 8000;

        // Create the map
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -5,
            maxZoom: 3
        });

        // Define the boundaries of the image
        const bounds = [
            [0, 0],
            [imageHeight, imageWidth]
        ];

        // Put the image onto the map
        L.imageOverlay('map.jpg', bounds).addTo(map);

        // Fit the map to the image
        map.fitBounds(bounds);

        map.on('click', function(e) {

            const x = Math.round(e.latlng.lng);
            const y = Math.round(e.latlng.lat);

            document.getElementById('coordinates').textContent =
                `X: ${x} | Y: ${y}`;

        });

        const horseColors = {
            common: "#4CAF50",
            uncommon: "#FFC107",
            rare: "#F44336"
        };

        // ========================================
        // HORSE FILTER
        // ========================================

        const horseFilter =
            document.getElementById("horse-filter");


        // ========================================
        // CREATE HORSE FILTER OPTIONS
        // ========================================

        // Store every unique horse name

        const horses = new Set();


        horseSpawns.forEach(spawn => {

            spawn.horses.forEach(horse => {

                horses.add(horse.name);

            });

        });


        // Add horses to the dropdown

        Array.from(horses)

            .sort()

            .forEach(horseName => {

                const option =
                    document.createElement("option");

                option.value = horseName;

                option.textContent = horseName;

                horseFilter.appendChild(option);

            });


        // ========================================
        // CREATE HORSE SPAWN MARKERS
        // ========================================

        const spawnMarkers = [];


        horseSpawns.forEach(spawn => {

            // ========================================
            // LOCATION MARKER COLOR
            // ========================================

            const markerColor =
                horseColors[spawn.locationRarity];


            const icon = L.divIcon({

                className: "horse-marker",

                html: `<div style="
                    background: ${markerColor};
                    width: 18px;
                    height: 18px;
                    border-radius: 50%;
                    border: 3px solid white;
                    box-shadow: 0 1px 4px rgba(0,0,0,0.5);
                "></div>`,

                iconSize: [24, 24],

                iconAnchor: [12, 12]

            });


            // ========================================
            // HORSE LIST
            // ========================================

            const horseList = spawn.horses

                .map(horse => {

                    const horseColor =
                        horseColors[horse.rarity];


                    const rarityName =
                        horse.rarity.charAt(0).toUpperCase()
                        + horse.rarity.slice(1);


                    return `
                        <li>
                            ${horse.name}

                            <span style="
                                color: ${horseColor};
                                font-size: 0.9em;
                                font-weight: bold;
                            ">
                                (${rarityName})
                            </span>
                        </li>
                    `;

                })

                .join("");


            // ========================================
            // LOCATION RARITY
            // ========================================

            const locationRarityName =
                spawn.locationRarity.charAt(0).toUpperCase()
                + spawn.locationRarity.slice(1);


            // ========================================
            // POPUP
            // ========================================

            const popup = `

                <div>

                    <h3>${spawn.name}</h3>

                    <p>
                        <strong>Spawn Location:</strong>

                        <span style="
                            color: ${markerColor};
                            font-weight: bold;
                        ">
                            ${locationRarityName}
                        </span>
                    </p>

                    <h4>Possible Horses</h4>

                    <ul>
                        ${horseList}
                    </ul>

                </div>

            `;


            // ========================================
            // CREATE MARKER
            // ========================================

            const marker = L.marker(
                [spawn.y, spawn.x],
                { icon: icon }
            )

            .addTo(map)

            .bindTooltip(spawn.name)

            .bindPopup(popup);


            // Save marker and spawn data

            spawnMarkers.push({

                marker: marker,
        
                spawn: spawn

            });

        });


        // ========================================
        // APPLY FILTERS
        // ========================================

        function applyFilters() {


            // ----------------------------------------
            // Get selected location rarities
            // ----------------------------------------

            const selectedRarities =

                Array.from(

                    document.querySelectorAll(
                        '#filter-panel input[type="checkbox"]:checked'
                    )

                )

                .map(input => input.value);


            // ----------------------------------------
            // Get selected horse
            // ----------------------------------------

            const selectedHorse =
                horseFilter.value;


            // ----------------------------------------
            // Check every spawn location
            // ----------------------------------------

            spawnMarkers.forEach(item => {

                const spawn = item.spawn;

                const marker = item.marker;


                // ------------------------------------
                // Check location rarity
                // ------------------------------------

                const rarityMatches =
                    selectedRarities.includes(
                        spawn.locationRarity
                    );


                // ------------------------------------
                // Check horse
                // ------------------------------------

                const horseMatches =

                    !selectedHorse ||

                    spawn.horses.some(horse =>

                        horse.name === selectedHorse

                    );


                // ------------------------------------
                // Show / hide marker
                // ------------------------------------

                if (
                    rarityMatches &&
                    horseMatches
                ) {

                    marker.addTo(map);

                }

                else {

                    marker.removeFrom(map);

                }

            });

        }


        // ========================================
        // FILTER EVENT LISTENERS
        // ========================================

        
        // Location rarity checkboxes

        document
        
            .querySelectorAll(
                '#filter-panel input[type="checkbox"]'
            )

            .forEach(checkbox => {

                checkbox.addEventListener(
                    "change",
                    applyFilters
                );

            });


        // Horse dropdown

        horseFilter.addEventListener(
            "change",
            applyFilters
        );


        // ========================================
        // RESET FILTERS
        // ========================================

        document

            .getElementById("reset-filters")

            .addEventListener(
                "click",
                function() {


                    // Turn all rarity filters back on

                    document

                        .querySelectorAll(
                            '#filter-panel input[type="checkbox"]'
                        )

                        .forEach(checkbox => {
        
                            checkbox.checked = true;

                        });


                    // Reset horse selection

                    horseFilter.value = "";


                    // Apply reset

                    applyFilters();

                }
            );

    </script>

</body>
</html>
